data:
  movies_path: data/ml-1m/movies.dat
  encoding: latin-1
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  input_dim: 384
  standardize: true
  embeddings_path: outputs/ml1m_embeddings.npy
  items_csv: outputs/ml1m_movies.csv
  stats_path: outputs/ml1m_stats.npz

model:
  encoder_hidden: [256, 128]
  latent_dim: 32
  num_levels: 3
  codebook_size: 64
  commitment_beta: 0.25
  codebook_update: ema
  ema_decay: 0.99
  ema_eps: 1.0e-5

train:
  optimizer: adam
  lr: 1.0e-3
  batch_size: 256
  epochs: 300
  kmeans_init: true
  reinit_enabled: true
  reinit_every: 250
  reinit_usage_threshold: 0.5
  seed: 0

output:
  sids_csv: outputs/ml1m_sids.csv
  checkpoints_dir: outputs/ml1m_checkpoints
  metrics_json: outputs/ml1m_metrics.json
