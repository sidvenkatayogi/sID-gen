name: amazon_beauty

data:
  meta_path: data/amazon/meta_Beauty.json.gz
  embedding_model: sentence-transformers/sentence-t5-base
  input_dim: 768
  standardize: true

model:
  encoder_hidden: [512, 256, 128]
  latent_dim: 32
  num_levels: 3
  codebook_size: 256
  commitment_beta: 0.25
  codebook_update: ema
  ema_decay: 0.99
  ema_eps: 1.0e-5

train:
  optimizer: adagrad
  lr: 0.4
  batch_size: 1024
  epochs: 20000
  kmeans_init: true
  reinit_enabled: true
  reinit_every: 250
  reinit_usage_threshold: 0.5
  seed: 0
