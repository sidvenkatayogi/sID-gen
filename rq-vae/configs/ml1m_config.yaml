name: ml1m

data:
  movies_path: data/ml-1m/movies.dat
  encoding: latin-1
  embedding_model: sentence-transformers/all-MiniLM-L6-v2
  input_dim: 384
  standardize: true

model:
  encoder_hidden: [256, 128]
  latent_dim: 32
  num_levels: 3
  codebook_size: 64
  commitment_beta: 0.25
  codebook_update: ema
  ema_decay: 0.99
  ema_eps: 1.0e-5

train:
  optimizer: adam
  lr: 1.0e-3
  batch_size: 256
  epochs: 300
  kmeans_init: true
  reinit_enabled: true
  reinit_every: 250
  reinit_usage_threshold: 0.5
  seed: 0
